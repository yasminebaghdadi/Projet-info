
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Résultat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Résultat de l'interprétation</h2>

        <div class="card">
            <h3>{{ dream["title"] }}</h3>
            <p><strong>Votre rêve :</strong></p>
            <p>{{ dream["content"] }}</p>

            <p><strong>Interprétation IA :</strong></p>
            <p>{{ dream["interpretation"] }}</p>
        </div>

        <div class="buttons">
            <a href="{{ url_for('dashboard') }}" class="btn">Retour au tableau de bord</a>
            <a href="{{ url_for('add_dream') }}" class="btn">Ajouter un autre rêve</a>
        </div>
    </div>
</body>
</html>
