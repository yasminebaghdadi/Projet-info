<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tableau de bord</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Bonjour {{ username }}</h2>

        <div class="buttons">
            <a href="{{ url_for('add_dream') }}" class="btn">Ajouter un rêve</a>
            <a href="{{ url_for('logout') }}" class="btn">Déconnexion</a>
        </div>

        <h3>Mes rêves</h3>

        {% if dreams %}
            {% for dream in dreams %}
                <div class="card">
                    <h4>{{ dream["title"] }}</h4>
                    <p>{{ dream["content"] }}</p>
                    <p><strong>Interprétation :</strong> {{ dream["interpretation"] }}</p>
                </div>
            {% endfor %}
        {% else %}
            <p>Aucun rêve enregistré pour le moment.</p>
        {% endif %}
    </div>
</body>
</html>
